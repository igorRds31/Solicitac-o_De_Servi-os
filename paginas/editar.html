<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Editar</title>
</head>
<body>

    <header>
        <div class="logo"><a href="index.html"><img src="../img/png.logo.png" alt="Logo"></a></div>
        <nav>
            <div class="nav-toggle" id="nav-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html">Agendar</a>
                <a href="solicitacoes.html">Minhas Solicitações</a>
            </div>
        </nav>
    </header>

    <main>
        <section id="editar-container">
            
            <form id="editar-form">
                <h2>Editar Solicitações</h2>
                <div class="edicao">
                <select id="servico-select" name="servico" required>
                <option value="">Selecione um serviço...</option>
                </select>
                </div>

                <div class="edicao">
                <label>Seu Nome:</label>
                <input type="text" name="nome" placeholder="Seu nome" required>
                </div>

                <div class="edicao">
                <label for="data">Data Desejada:</label>
                <input type="date" name="data" required>
                </div>

                <div class="edicao">
                <label for="horario">Horário Desejado:</label>
                <input type="time" name="horario" required>
                </div>



                <div class="edicao">
                <input type="hidden" name="indice" id="indice-original">
                </div>

                <div class="botoes_edicao">
                    <button type="submit">Salvar Alterações</button>
                    <button type="button" id="btn-cancelar"></button>
                </div>
            </form>
        </section>
    </main>

         <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="editar.js"></script>
        
        <!-- Mobile Navigation Script -->
        <script>
            const navToggle = document.getElementById('nav-toggle');
            const navMenu = document.getElementById('nav-menu');
            
            navToggle.addEventListener('click', () => {
                navMenu.classList.toggle('active');
                navToggle.classList.toggle('active');
            });
            
            // Close menu when clicking on a link
            document.querySelectorAll('.nav-menu a').forEach(link => {
                link.addEventListener('click', () => {
                    navMenu.classList.remove('active');
                    navToggle.classList.remove('active');
                });
            });
        </script>
    
</body>
</html>
